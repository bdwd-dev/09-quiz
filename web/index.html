<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Gamifié</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #fff; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; }
    .logo { font-size: 24px; font-weight: bold; color: #FF9800; }
    .nav { display: flex; gap: 20px; }
    .nav a { color: #aaa; text-decoration: none; font-size: 14px; }
    .nav a:hover { color: #FF9800; }
    .hero { text-align: center; padding: 60px 20px; }
    .hero h1 { font-size: 36px; margin-bottom: 16px; color: #FF9800; }
    .hero p { color: #888; font-size: 18px; max-width: 600px; margin: 0 auto 30px; }
    .btn { background: #FF9800; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 30px 0; }
    .stat-card { background: #1a1a1a; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-value { font-size: 28px; font-weight: bold; color: #FF9800; }
    .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
    .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px 0; }
    .item-card { background: #1a1a1a; border-radius: 12px; padding: 20px; border: 1px solid #2a2a2a; }
    .item-card:hover { border-color: #FF9800; }
    .item-name { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .item-desc { color: #888; font-size: 14px; margin-bottom: 12px; }
    .footer { text-align: center; padding: 40px 0; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "https://zero9-quiz-backend.onrender.com/api";

    function App() {
      const [stats, setStats] = useState({});
      const [items, setItems] = useState([]);

      useEffect(() => {
        fetch(`${API}/stats`).then(r => r.json()).then(setStats);
      }, []);

      return (
        <div>
          <header className="header">
            <div className="logo">Quiz Gamifié</div>
            <nav className="nav">
              <a href="#">Accueil</a>
              <a href="#">Services</a>
              <a href="#">Contact</a>
            </nav>
          </header>

          <section className="hero">
            <h1>Quiz Gamifié</h1>
            <p>Diagnostic J1, Entraînement, Tournois — Solution adaptée au contexte Congo-Brazzaville</p>
            <button className="btn">En savoir plus</button>
          </section>

          <div className="container">
            <div className="stats">
              <div className="stat-card">
                <div className="stat-value">{stats.users || stats.products || stats.draws || stats.federations || stats.artists || stats.clients || 0}</div>
                <div className="stat-label">Utilisateurs</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.orders || stats.tickets || stats.clubs || stats.events || stats.projects || 0}</div>
                <div className="stat-label">Commandes</div>
              </div>
              <div className="stat-card">
                <div className="stat-value">{stats.revenue ? stats.revenue.toLocaleString() + " F" : "0"}</div>
                <div className="stat-label">CA</div>
              </div>
            </div>
          </div>

          <footer className="footer">
            <p>© 2026 Quiz Gamifié — Brazzaville, Congo</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
